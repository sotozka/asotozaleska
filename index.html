<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Soto Zaleska · Below the Cloud</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark mode colours */
        :root {
            --bg-color: #15110f;
            --text-color: #E8E2D5;
            --title-color: #E8E2D5;
            --tagline-color: #A89F91;
            --metadata-color: #5A5248;
            --brass: #C89A3D;
            --brass-rule-opacity: 0.4;
            --silver: #7A96B8;
            --photo-border-opacity: 0.3;
        }

        /* Light mode colours */
        body.light-mode {
            --bg-color: #f7f4ee;
            --text-color: #4a443c;
            --title-color: #1a1815;
            --tagline-color: #4a443c;
            --metadata-color: #8a8278;
            --brass-rule-opacity: 0.5;
            --photo-border-opacity: 0.5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 400;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            position: relative;
            transition: background-color 0.3s ease, color 0.2s ease;
        }

        /* Film grain noise texture — sacred, nocturnal, analog */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
            mix-blend-mode: overlay;
            transition: opacity 0.3s ease;
        }

        /* Slightly lighter grain for light mode */
        body.light-mode::before {
            opacity: 0.6;
        }

        /* Main container: like a civic plaque */
        .container {
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Photo treatment: desaturated, slightly dimmed, warm */
        .portrait {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 0;
            filter: brightness(0.85) saturate(0.7) sepia(0.15);
            margin-bottom: 2rem;
            border: 0.5px solid rgba(200, 154, 61, var(--photo-border-opacity));
            transition: border-color 0.2s ease;
        }

        /* Name: anchor of the page */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 36px;
            letter-spacing: -0.5px;
            color: var(--title-color);
            margin-bottom: 0.75rem;
            transition: color 0.2s ease;
        }

        /* Brass rule: thin, warm, sacred */
        .brass-rule {
            width: 60px;
            height: 1px;
            background-color: var(--brass);
            opacity: var(--brass-rule-opacity);
            margin: 1.5rem 0 1.25rem 0;
            transition: opacity 0.2s ease;
        }

        /* BELOW THE CLOUD: subtitle, etched brass */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--brass);
            margin-bottom: 0.25rem;
        }

        /* Tagline: soft text tone */
        .tagline {
            font-size: 16px;
            color: var(--tagline-color);
            margin-bottom: 2.5rem;
            max-width: 480px;
            transition: color 0.2s ease;
        }

        /* Link styling: weathered silver to brass on hover */
        .link-list {
            list-style: none;
            margin-bottom: 3rem;
        }

        .link-list li {
            margin-bottom: 1.25rem;
        }

        .link-list a {
            font-size: 16px;
            text-decoration: none;
            color: var(--silver);
            transition: color 0.25s ease;
            display: inline-block;
        }

        .link-list a:hover {
            color: var(--brass);
        }

        /* Sliding arrow: slight movement */
        .link-list a::after {
            content: " ⟶";
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .link-list a:hover::after {
            transform: translateX(3px);
        }

        /* Metadata: receded, almost archival */
        .metadata {
            font-size: 11px;
            color: var(--metadata-color);
            border-top: 1px solid rgba(200, 154, 61, 0.2);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
            transition: color 0.2s ease;
        }

        /* Brass highlight on text selection */
        ::selection {
            background-color: var(--brass);
            color: #15110f;
        }

        /* Light mode selection color */
        body.light-mode ::selection {
            background-color: var(--brass);
            color: #f7f4ee;
        }

        /* Mode toggle button styling */
        .mode-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: rgba(200, 154, 61, 0.15);
            border: 0.5px solid rgba(200, 154, 61, 0.4);
            color: var(--brass);
            font-size: 12px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Instrument Sans', sans-serif;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 100;
            border-radius: 0;
        }

        .mode-toggle:hover {
            background: rgba(200, 154, 61, 0.3);
            border-color: var(--brass);
        }

        /* Small screen adjustments */
        @media (max-width: 600px) {
            body {
                padding: 1.5rem;
                justify-content: flex-start;
            }
            h1 {
                font-size: 28px;
            }
            .tagline {
                font-size: 15px;
            }
            .mode-toggle {
                bottom: 1rem;
                right: 1rem;
                padding: 6px 12px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="portrait" src="20211227_143919.jpg" alt="Portrait of Ana Soto Zaleska, Zaragoza">
        
        <h1>Ana Soto Zaleska</h1>
        <div class="brass-rule"></div>
        <div class="subtitle">BELOW THE CLOUD</div>
        <div class="brass-rule"></div>
        
        <div class="tagline">
            Writing about data centres, power, and the case for democratic accountability from Zaragoza, Spain.
        </div>
        
        <ul class="link-list">
            <li><a href="https://asotozaleska.substack.com" target="_blank" rel="noopener noreferrer">Substack </a></li>
            <li><a href="https://linkedin.com/in/asotozaleska" target="_blank" rel="noopener noreferrer">LinkedIn </a></li>
        </ul>
        
        <div class="metadata">
            This page is a threshold, not a dashboard.
        </div>
    </div>

    <!-- Button (just one icon + text) -->
<button class="mode-toggle" id="darkModeToggle">☀️ Light</button>

<script>
    const toggleButton = document.getElementById('darkModeToggle');
    
    function updateButtonText() {
        if (document.body.classList.contains('light-mode')) {
            toggleButton.textContent = '🌙 Dark';
        } else {
            toggleButton.textContent = '☀️ Light';
        }
    }
    
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
    }
    updateButtonText();
    
    toggleButton.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        
        if (document.body.classList.contains('light-mode')) {
            localStorage.setItem('theme', 'light');
        } else {
            localStorage.setItem('theme', 'dark');
        }
        
        updateButtonText();
    });
</script>

    <script>
        const toggleButton = document.getElementById('darkModeToggle');
        
        // Check for saved preference on load
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
        
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            
            // Save preference
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
