<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Soto Zaleska · Below the Cloud</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #15110f;
            color: #E8E2D5;
            background-image: radial-gradient(rgba(200, 154, 61, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 400;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
        }

        /* Main container — like a civic plaque */
        .container {
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
        }

        /* Photo treatment — desaturated, slightly dimmed, warm */
        .portrait {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 0.5px solid rgba(200, 154, 61, 0.3);
            filter: brightness(0.85) saturate(0.7) sepia(0.15);
            margin-bottom: 2rem;
        }

        /* Name — anchor of the page */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 36px;
            letter-spacing: -0.5px;
            color: #E8E2D5;
            margin-bottom: 0.75rem;
        }

        /* Brass rule — thin, warm, sacred */
        .brass-rule {
            width: 60px;
            height: 1px;
            background-color: #C89A3D;
            opacity: 0.4;
            margin: 1.5rem 0 1.25rem 0;
        }

        /* BELOW THE CLOUD — subtitle, etched brass */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #C89A3D;
            margin-bottom: 0.25rem;
        }

        /* Tagline — soft text tone */
        .tagline {
            font-size: 16px;
            color: #A89F91;
            margin-bottom: 2.5rem;
            max-width: 480px;
        }
        
        /*Highlight colour — a tiny secret*/
        ::selection {
    background-color: #C89A3D;
    color: #15110f;
}

        /* Link styling — weathered silver to brass on hover */
        .link-list {
            list-style: none;
            margin-bottom: 3rem;
        }

	.link-list a {
	    font-size: 16px;
	    text-decoration: none;
	    color: #7A96B8;  /* weathered silver */
	    transition: color 0.25s ease;
	    display: inline-block;
	}

	.link-list a:hover {
	    color: #C89A3D;  /* brass */
	    cursor: crosshair;
	}

	.link-list a::after {
	    content: " →";
	    transition: transform 0.2s ease;
	    display: inline-block;
	}

	.link-list a:hover::after {
	    transform: translateX(2px);
	}

        /* Metadata — receded, almost archival */
        .metadata {
            font-size: 11px;
            color: #5A5248;
            border-top: 1px solid rgba(200, 154, 61, 0.2);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }

        /* Small screen adjustments */
        @media (max-width: 600px) {
            body {
                padding: 1.5rem;
                justify-content: flex-start;
            }
            h1 {
                font-size: 28px;
            }
            .tagline {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="portrait" src="20211227_143919.jpg" alt="Portrait of Ana Soto Zaleska, Zaragoza">
        
        <h1>Ana Soto Zaleska</h1>
        <div class="brass-rule"></div>
        <div class="subtitle">BELOW THE CLOUD</div>
        <div class="brass-rule"></div>
        
        <div class="tagline">
            Writing about data centres, power, and the case for democratic accountability from Zaragoza, Spain.
        </div>
        
        <ul class="link-list">
            <li><a href="https://asotozaleska.substack.com" target="_blank" rel="noopener noreferrer">Substack </a></li>
            <li><a href="https://linkedin.com/in/asotozaleska" target="_blank" rel="noopener noreferrer">LinkedIn </a></li>
        </ul>
        
        <div class="metadata">
            This page is a threshold, not a dashboard.
        </div>
    </div>
</body>
</html>
